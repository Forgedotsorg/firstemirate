<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-label="Security solutions — CCTV camera">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1.08" r="0.62">
      <stop offset="0" stop-color="#b40303" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#b40303" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#b40303" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d4d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="0.8" fill="#fff" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#ff4d4d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .l{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.4}
      .m{stroke-opacity:.35}
      .f{stroke-opacity:.18}
      .r{stroke:#ff4d4d}
      .rf{fill:#ff4d4d}
    </style>
  </defs>
  <rect width="280" height="160" fill="url(#bg)"/>
  <rect width="280" height="160" fill="url(#dots)"/>
  <rect width="280" height="160" fill="url(#glow)"/>
  <path class="l f" d="M24 150 H256"/>
  <polygon points="181,75 238,148 166,152" fill="url(#beam)"/>
  <rect class="l" x="64" y="36" width="12" height="42" rx="3"/>
  <path class="l" d="M76 57 L100 54"/>
  <g transform="rotate(14 100 54)">
    <rect class="l" x="96" y="33" width="96" height="7" rx="3.5"/>
    <rect class="l" x="100" y="40" width="84" height="28" rx="8"/>
    <path class="l m" d="M112 50 H150 M112 58 H140"/>
    <circle class="l r" cx="184" cy="54" r="10"/>
    <circle class="rf" cx="184" cy="54" r="4"/>
  </g>
  <rect x="0.5" y="0.5" width="279" height="159" rx="0" fill="none" stroke="#fff" stroke-opacity="0.06"/>
</svg>
