<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-label="Network solutions — connected network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1c1c"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1.08" r="0.62">
      <stop offset="0" stop-color="#b40303" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#b40303" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#b40303" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d4d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff4d4d" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="0.8" fill="#fff" fill-opacity="0.07"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#ff4d4d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .l{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.4}
      .m{stroke-opacity:.35}
      .f{stroke-opacity:.18}
      .r{stroke:#ff4d4d}
      .rf{fill:#ff4d4d}
    </style>
  </defs>
  <rect width="280" height="160" fill="url(#bg)"/>
  <rect width="280" height="160" fill="url(#dots)"/>
  <rect width="280" height="160" fill="url(#glow)"/>
  <path class="l f" d="M24 150 H256"/>
  <path class="l f" d="M80 50 L140 28 L200 48 M84 112 L140 134 L198 110 M80 50 L84 112 M200 48 L198 110"/>
  <path class="l m" d="M140 80 L80 50 M140 80 L140 28 M140 80 L200 48 M140 80 L84 112 M140 80 L140 134 M140 80 L198 110"/>
  <circle cx="140" cy="80" r="34" fill="none" stroke="#ff4d4d" stroke-opacity=".15" stroke-width="2"/>
  <circle cx="140" cy="80" r="23" fill="none" stroke="#ff4d4d" stroke-opacity=".35" stroke-width="2"/>
  <circle class="l r" cx="140" cy="80" r="12" fill="#111"/>
  <circle class="rf" cx="140" cy="80" r="4.5"/>
  <g fill="#111">
    <circle class="l" cx="80" cy="50" r="6"/><circle class="l" cx="140" cy="28" r="6"/>
    <circle class="l" cx="200" cy="48" r="6"/><circle class="l" cx="84" cy="112" r="6"/>
    <circle class="l" cx="140" cy="134" r="6"/><circle class="l" cx="198" cy="110" r="6"/>
  </g>
  <rect x="0.5" y="0.5" width="279" height="159" rx="0" fill="none" stroke="#fff" stroke-opacity="0.06"/>
</svg>
